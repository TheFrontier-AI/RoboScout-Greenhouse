# R1 demo stack on one Nebius AI Cloud VM (NVIDIA RTX PRO 6000 Blackwell, x86_64).
# Isaac Sim (jobs/isaac_eval) and the SLAM job (cloud/mapping) run as separate `docker run`s: see README.md.
#   cp .env.example .env && docker compose up -d --build
services:
  eyes:                       # Cosmos Reason behind an OpenAI-compatible API (also the Serverless Endpoint image)
    build: { context: ../../cloud/eyes }
    env_file: .env
    # Shares the one 96 GB GPU with Isaac Sim → 8B at ~35 % memory. For a dedicated GPU/endpoint use
    # COSMOS_MODEL=nvidia/Cosmos-Reason2-32B GPU_MEM_UTIL=0.92 (BF16 weights alone are ~66 GB).
    environment:
      COSMOS_MODEL: "${COSMOS_MODEL:-nvidia/Cosmos-Reason2-8B}"
      GPU_MEM_UTIL: "${GPU_MEM_UTIL:-0.35}"
      MAX_MODEL_LEN: "${MAX_MODEL_LEN:-16384}"
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["hf-cache:/root/.cache/huggingface"]
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }
    restart: unless-stopped

  robot-api:                  # goal hub between HERMES, the robot (sim) and Cosmos; writes the dashboard data dir
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install -q openai pydantic && python3 agent/robot_api.py --host 0.0.0.0 --port 8090 --data /runs/demo --map data/tunnel09_aisle_map_v18.json"
    env_file: .env
    environment: { EYES_BASE_URL: "http://eyes:8000/v1" }
    volumes: ["../..:/app:ro", "runs:/runs"]
    ports: ["127.0.0.1:8090:8090"]
    depends_on: [eyes]
    restart: unless-stopped

  dashboard:
    image: python:3.12-slim
    working_dir: /app
    command: python3 dashboard/serve.py --data /runs/demo --port 8080
    volumes: ["../..:/app:ro", "runs:/runs:ro"]
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped

volumes: { hf-cache: {}, runs: {} }
